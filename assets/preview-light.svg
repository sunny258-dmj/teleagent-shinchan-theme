<rect x="278" y="438" width="602" height="222" rx="20" fill="#fffdf8" stroke="#d4e3f0"/><circle cx="326" cy="492" r="24" fill="#fff4cb"/><circle cx="326" cy="492" r="15" fill="#f4c8a6" stroke="#2d2d32" stroke-width="3"/><rect x="365" y="468" width="410" height="56" rx="16" fill="#eef6ff"/><text x="388" y="502" font-family="Arial,'Microsoft YaHei'" font-size="15" fill="#43577e">新版不会再出现悬空头像、绿色雾和底部贴纸。</text><rect x="470" y="543" width="340" height="52" rx="16" fill="#3977e8"/><text x="492" y="575" font-family="Arial,'Microsoft YaHei'" font-size="15" fill="#fff">主题覆盖全界面，但不抢内容本身。</text><rect x="310" y="613" width="538" height="30" rx="11" fill="#ffffff" stroke="#d8e6f2"/>
