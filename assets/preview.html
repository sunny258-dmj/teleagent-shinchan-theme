<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleAgent 蜡笔小新主题预览</title><link rel="icon" href="shinchan-avatar.svg"><link rel="stylesheet" href="shinchan-theme.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui;color:var(--foreground);overflow:hidden}body::before{top:74px;right:24px}body::after{right:24px;bottom:12px}.app{height:100vh;display:grid;grid-template-columns:236px 1fr;background:color-mix(in srgb,var(--background) 93%,transparent)}aside{padding:18px 14px;border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-size:20px;font-weight:800}.brand img{width:44px;height:44px;object-fit:contain}.nav{padding:11px 12px;border-radius:14px;color:var(--secondary-foreground)}.nav.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:800}.sidebar-art{margin-top:auto;height:150px;background:url(shinchan-wave.svg) left bottom/105px auto no-repeat,url(shiro.svg) right bottom/74px auto no-repeat;border-radius:18px;background-color:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--sidebar-border)}main{display:flex;flex-direction:column;min-width:0}.top{height:68px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.switch{border:1px solid var(--border);background:var(--card);color:var(--foreground);padding:9px 13px;border-radius:13px}.stage{padding:26px 52px;overflow:auto}.hero{height:140px;border:1px solid var(--border);border-radius:24px;background:url(shinchan-scene.svg) center/cover no-repeat;display:flex;align-items:center;padding:0 32px;box-shadow:0 15px 36px var(--shadow);margin-bottom:22px}.hero h1{font-size:34px;margin:0}.hero p{margin:8px 0 0;color:#435676;font-weight:600}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.home-query-card{padding:18px;min-height:140px;border-radius:20px}.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--accent);font-size:23px}.card-title{margin:14px 0 6px;font-weight:800}.card-copy{font-size:13px;line-height:1.55;color:var(--muted-foreground)}.workspace{display:grid;grid-template-columns:1fr 260px;gap:16px;margin-top:18px}.chat{padding:18px;border:1px solid var(--border);border-radius:22px;background:var(--card);box-shadow:0 15px 34px var(--shadow)}.message{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.message.user{justify-content:flex-end}.avatar{width:38px;height:38px;border-radius:13px;background:var(--secondary);padding:3px}.bubble{max-width:620px;padding:13px 16px;border-radius:7px 18px 18px;background:var(--secondary);line-height:1.65}.user .bubble{background:var(--primary);color:white;border-radius:18px 7px 18px 18px}.composer{margin-top:18px;padding:12px 14px;border:1px solid var(--input);border-radius:16px;background:var(--popover);display:flex;align-items:center;gap:12px;color:var(--subtle-foreground)}.send{margin-left:auto;padding:9px 17px;border:0;border-radius:12px;color:var(--primary-foreground);background:var(--primary);font-weight:800}.panel{border:1px solid var(--border);border-radius:22px;background:var(--card);padding:14px;overflow:hidden}.panel h3{margin:2px 0 12px}.empty{height:200px;background:url(shinchan-sleep.svg) center 35px/118px auto no-repeat;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:var(--muted-foreground);font-size:13px;padding-bottom:16px}.dark .hero p{color:#d9e6f6}.dark .hero{filter:saturate(.82) brightness(.72)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.panel{display:none}}
</style></head><body><div id="shinchan-theme-decor"><i class="avatar-badge"></i><i class="shinchan-scene"></i><i class="shiro"></i><i class="sleep"></i></div><div class="app"><aside><div class="brand"><img src="shinchan-avatar.svg" alt=""><span>TeleAgent</span></div><div class="nav active">🏠　首页</div><div class="nav">💬　聊天</div><div class="nav">🧩　Skills</div><div class="nav">📁　文件</div><div class="nav">⚙️　设置</div><div class="sidebar-art"></div></aside><main><div class="top"><strong>蜡笔小新 · TeleAgent</strong><button class="switch" onclick="document.documentElement.classList.toggle('dark')">☀ / ☾ 切换明暗</button></div><div class="stage"><section class="hero"><div><h1>嗨，今天也要加油呀！</h1><p>轻松、明亮、俏皮，但不牺牲信息密度与可读性。</p></div></section><div class="cards"><section class="home-query-card"><div class="icon">💬</div><div class="card-title">开始聊天</div><div class="card-copy">和智能体讨论任务、想法与下一步。</div></section><section class="home-query-card"><div class="icon">✏️</div><div class="card-title">创建内容</div><div class="card-copy">把灵感快速变成文档、方案和作品。</div></section><section class="home-query-card"><div class="icon">🧭</div><div class="card-title">探索信息</div><div class="card-copy">查找资料并整理成可执行的结论。</div></section><section class="home-query-card"><div class="icon">📁</div><div class="card-title">处理文件</div><div class="card-copy">分析、归纳和转换你的工作材料。</div></section></div><div class="workspace"><section class="chat"><div class="message"><img class="avatar" src="shinchan-avatar.svg" alt=""><div class="bubble">主题已经覆盖到顶部、侧栏、主页卡片、聊天、弹窗和空状态啦。</div></div><div class="message user"><div class="bubble">深色模式也要好看，而且别影响原功能。</div></div><div class="message"><img class="avatar" src="shiro.svg" alt=""><div class="bubble">汪！交互逻辑保持不变，只替换视觉层。</div></div><div class="composer"><span>输入一条消息……</span><button class="send">发送</button></div></section><aside class="panel"><h3>空状态</h3><div class="empty">暂时没有内容<br>小新先睡一会儿～</div></aside></div></div></main></div><script>if(location.search.includes('dark=1'))document.documentElement.classList.add('dark')</script></body></html>
