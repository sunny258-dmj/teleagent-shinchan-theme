<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleAgent 蜡笔小新主题 2.2</title><link rel="icon" href="shinchan-avatar.svg"><link rel="stylesheet" href="shinchan-theme.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui;color:var(--foreground);overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:300px 1fr}.sidebar{position:relative;padding:22px 18px;border-right:1px solid var(--sidebar-border);background:var(--sidebar);overflow:hidden}.brand{font-size:20px;font-weight:900;line-height:1.3;margin:5px 12px 28px}.nav{height:46px;border-radius:18px;padding:11px 14px;margin:6px 0;color:var(--secondary-foreground);font-size:17px}.nav.active{background:#f5fbff;box-shadow:0 5px 16px var(--shadow);font-weight:800}.tasks{margin-top:28px;border-top:1px solid var(--separator);padding-top:16px;font-size:14px;color:var(--muted-foreground)}.task{padding:9px 10px;border-radius:12px}.side-art{position:absolute;left:20px;right:20px;bottom:8px;height:118px;background:url(shinchan-sleep.svg) center bottom/contain no-repeat}.main{position:relative;min-width:0;background:linear-gradient(180deg,#dff3ff 0,#eff9ff 62%,#f9fdff 100%);overflow:hidden}.hero{height:360px;background:url(shinchan-scene.svg) center top/cover no-repeat;padding:86px 80px 0}.hello{display:inline-block;padding:8px 16px;border-radius:22px;background:#ffe36d;font-weight:900;transform:rotate(-5deg);margin-bottom:12px}.hero h1{font-size:42px;line-height:1.15;margin:0;color:#172a4d;font-weight:950}.hero p{font-size:18px;margin:18px 0 0;color:#3f557b;font-weight:700}.workspace{padding:14px 70px 34px}.tabs{height:55px;border-radius:28px;background:#d6ebfa;display:flex;align-items:center;gap:10px;padding:6px 12px;margin-bottom:20px}.tab{padding:11px 22px;border-radius:22px;font-size:16px}.tab.active{background:white;border:2px solid #4d8df8;color:#2b6fef;box-shadow:0 4px 14px var(--shadow)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.home-query-card{min-height:154px;padding:22px 24px;border-radius:18px}.home-query-card:nth-child(1){background:linear-gradient(145deg,#fffdf8,#fff8e6)}.home-query-card:nth-child(2){background:linear-gradient(145deg,#fffdf8,#fff0f2)}.home-query-card:nth-child(3){background:linear-gradient(145deg,#fffdf8,#eefaf3)}.home-query-card:nth-child(4){background:linear-gradient(145deg,#fffdf8,#fff8e8)}.icon{font-size:34px}.title{font-size:20px;font-weight:900;margin:10px 0 8px}.copy{font-size:14px;line-height:1.6;color:var(--muted-foreground)}.composer{height:170px;margin-top:22px;border:2px solid #8fc3f4;border-radius:18px;background:#fff;padding:22px 26px;box-shadow:0 8px 24px var(--shadow);position:relative}.placeholder{color:#9babc1;font-size:16px}.tools{position:absolute;left:24px;bottom:18px;font-size:24px}.send{position:absolute;right:24px;bottom:16px;width:54px;height:54px;border:0;border-radius:50%;background:#4d8df8;color:#fff;font-size:24px}.dark .main{background:linear-gradient(180deg,#132943,#101d31 100%)}.dark .hero{filter:saturate(.72) brightness(.72)}.dark .hero h1,.dark .hero p{color:#eef5ff}.dark .tabs{background:#213a57}.dark .tab.active{background:#182b44}.dark .composer{background:#182b44;border-color:#45688b}@media(max-width:1100px){.app{grid-template-columns:240px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.hero{padding-left:42px}.workspace{padding-left:42px;padding-right:42px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">TeleAgent<br>星辰超级智能体</div><div class="nav active">▣　新建任务</div><div class="nav">♟　技能</div><div class="nav">▣　即时通讯</div><div class="tasks"><div>⌄　置顶 (0)</div><div class="task">工作空间</div><div class="task">10_班组 (1)</div><div class="task">蜡笔小新桌宠 (9)</div><div class="task">桌面宠物精简测试</div></div><div class="side-art"></div></aside><main class="main"><section class="hero"><div class="hello">你好！</div><h1>你说我做，随时待命</h1><p>和小新一起，让工作变简单！</p></section><section class="workspace"><div class="tabs"><span>想做点什么：</span><div class="tab active">⌕ 做调研</div><div class="tab">▦ 做表格</div><div class="tab">▣ 搭应用</div><div class="tab">▤ 写文档</div><div class="tab">♧ 替我办</div></div><div class="cards"><section class="home-query-card"><div class="icon">▣</div><div class="title">查招标商机</div><div class="copy">近7天招标全网搜，自动生成展示网页</div></section><section class="home-query-card"><div class="icon">▥</div><div class="title">做大客户分析</div><div class="copy">产业格局、决策链、合作机会，一份报告摸清大客户</div></section><section class="home-query-card"><div class="icon">▤</div><div class="title">分析品牌口碑</div><div class="copy">各平台口碑一网打尽，卖点吐槽全知道</div></section><section class="home-query-card"><div class="icon">⌁</div><div class="title">筛选跨境电商品类</div><div class="copy">哪些品类在涨？深度调研再入场</div></section></div><div class="composer"><div class="placeholder">有什么任务交给我吧...</div><div class="tools">▭　⌕　◉</div><button class="send">➤</button></div></section></main></div><script>if(location.search.includes('dark=1'))document.documentElement.classList.add('dark')</script></body></html>
